[package]
name = "petdex-bridge"
version = "0.1.0"
edition = "2021"
description = "WSL bridge CLI — POSTs hook events to the buddy Electron HTTP sidecar"

[[bin]]
name = "petdex-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
